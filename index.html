<!DOCTYPE html>
<html lang="en" data-theme="lukas">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machasal</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#D5D2D1" id="themeColor">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Machasal">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<style>
  /* ───── Themes ───── */
  [data-theme="lukas"]{
    --bg:#D5D2D1; --accent:#FF6B9A; --accent-deep:#F0568A;   /* cat eye pink / Nimbus Cloud 13-4108 (approx) */
    --ink:#000000; --ink-strong:#000000;
    --wash:rgba(255,107,154,.18); --glow:rgba(255,107,154,.42);
    --track:rgba(0,0,0,.14); --muted:rgba(0,0,0,.6); --err:#B00020;
    --cursor-stroke:white; color-scheme:light;
  }
  [data-theme="leonard"]{
    --bg:#D5D2D1; --accent:#ABD3DB; --accent-deep:#93C3CD;   /* Iced Aqua 13-5410 / Nimbus Cloud 13-4108 (approx) */
    --ink:#000000; --ink-strong:#000000;
    --wash:rgba(171,211,219,.32); --glow:rgba(171,211,219,.6);
    --track:rgba(0,0,0,.14); --muted:rgba(0,0,0,.6); --err:#B00020;
    --cursor-stroke:white; color-scheme:light;
  }
  :root{ --font:'Galmuri11','Pixelify Sans','DotGothic16','Malgun Gothic','Apple SD Gothic Neo',monospace; }
  body{-webkit-font-smoothing:none;font-smooth:never;letter-spacing:.01em;}

  /* simple black triangle cursor */
  [data-theme="lukas"] *,[data-theme="leonard"] *{cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='22' height='22'><polygon points='2,2 4,19 16,12' fill='black' stroke='white' stroke-width='1.4' stroke-linejoin='round'/></svg>") 2 2, auto !important;}

  *{box-sizing:border-box;font-family:var(--font);}
  html,body{margin:0;background:var(--bg);color:var(--ink);transition:background .3s;}
  body{min-height:100vh;padding:14px 14px 50px;}
  .wrap{max-width:1000px;margin:0 auto;}

  /* ───── Top bar ───── */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding-left:22px;}
  .logo{font-size:18px;font-weight:700;color:var(--ink);}
  .themes{display:flex;gap:6px;flex-wrap:wrap;}
  .theme-btn{
    display:flex;align-items:center;gap:7px;border:2px solid var(--accent);background:transparent;color:var(--ink);
    border-radius:999px;padding:6px 13px 6px 9px;font-size:13px;font-weight:700;
    transition:background .2s,color .2s;
  }
  .theme-btn i{width:13px;height:13px;border-radius:50%;display:block;border:1.5px solid var(--ink);}
  .theme-btn:hover{background:var(--wash);}
  .theme-btn.on{background:var(--accent);color:#000;}
  .theme-btn.on i{border-color:#000;}

  /* ───── Diary ───── */
  .diary{position:relative;padding-left:22px;}
  .rings{
    position:absolute;left:0;top:70px;bottom:40px;width:44px;z-index:3;
    display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;
  }
  .rings i{display:block;height:15px;width:44px;border:2px solid var(--accent);border-radius:999px;background:var(--bg);}
  .sheet{
    position:relative;border:2px solid var(--accent);border-radius:32px;overflow:hidden;background:var(--bg);
    min-height:70vh;
  }
  .tabs{display:flex;border-bottom:2px solid var(--accent);}
  .tab{
    flex:1;border:none;border-right:2px solid var(--accent);background:transparent;color:var(--ink);
    font-size:15px;font-weight:700;padding:14px 4px;border-radius:0;
    transition:background .2s,color .2s;
  }
  .tab:last-child{border-right:none;}
  .tab:hover{background:var(--wash);}
  .tab.active{background:var(--accent);color:#000;}
  .content{padding:22px 22px 40px 34px;}
  .page{display:none;}
  .page.active{display:block;}
  h1{margin:0 0 16px;font-size:22px;color:var(--ink);font-weight:700;}

  .pill-btn{
    border:2px solid var(--accent);background:transparent;color:var(--ink);
    border-radius:999px;padding:9px 18px;font-size:14px;font-weight:700;
    transition:background .2s,color .2s;
  }
  .pill-btn:hover{background:var(--accent);color:#000;}
  .pill-btn.solid{background:var(--accent);color:#000;}
  .pill-btn.solid:hover{background:var(--accent-deep);border-color:var(--accent-deep);}
  .pill-btn.small{padding:6px 13px;font-size:12px;}
  .pill-btn.on{background:var(--accent);color:#000;}

  /* ───── Home ───── */
  .home-box{
    min-height:48vh;display:flex;align-items:center;justify-content:center;
    border:2px dashed var(--accent);border-radius:36px;padding:14px;
  }
  .home-box.filled{border:none;padding:0;}
  .home-box img{max-width:100%;max-height:68vh;display:block;filter:drop-shadow(0 0 10px var(--glow));}
  .home-box .none{color:var(--muted);font-size:14px;text-align:center;}
  .home-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px;}

  .backup{margin-top:30px;padding-top:18px;border-top:2px dashed var(--accent);text-align:center;}
  .backup-title{font-size:15px;font-weight:700;color:var(--ink);}
  .backup .hint{margin:6px auto 0;max-width:34em;}
  .backup .home-actions{margin-top:12px;}

  /* ───── Calendar ───── */
  .cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .cal-title{font-size:22px;font-weight:700;color:var(--ink);min-width:170px;text-align:center;}
  .round{
    width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);
    background:transparent;color:var(--ink);font-size:18px;font-weight:700;
    display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s;
  }
  .round:hover{background:var(--accent);color:#000;}
  .dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  .dow div{text-align:center;color:var(--ink);font-weight:700;font-size:13px;padding:6px 0;}
  .cell{
    position:relative;min-height:100px;border:2px solid var(--accent);border-radius:22px;
    background:transparent;padding:8px 8px 6px;text-align:left;color:var(--ink);
    display:flex;flex-direction:column;gap:4px;overflow:hidden;
    transition:background .2s, transform .2s;
  }
  .cell:hover{background:var(--wash);transform:translateY(-2px);}
  .cell.out{opacity:.35;}
  .cell .num{font-size:13px;font-weight:700;}
  .cell.today .num{
    display:inline-flex;width:24px;height:24px;border-radius:50%;
    align-items:center;justify-content:center;background:var(--accent);color:#000;
  }
  .cell.has{background:var(--accent);color:#000;}
  .cell.has:hover{background:var(--accent-deep);}
  .cell.has.today .num{background:#000;color:var(--accent);}
  .chip{
    font-size:12px;font-weight:700;color:#000;line-height:1.25;
    background:rgba(0,0,0,.1);border-radius:999px;padding:3px 8px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* ───── Modal ───── */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;
    align-items:center;justify-content:center;padding:16px;z-index:50;
  }
  .overlay.open{display:flex;}
  .modal{
    width:min(440px,100%);max-height:92vh;overflow:auto;background:var(--bg);color:var(--ink);
    border:2px solid var(--accent);border-radius:32px;padding:22px;
  }
  .modal.wide{width:min(620px,100%);}
  .modal h2{margin:0 0 14px;color:var(--ink);font-size:20px;}
  .ev{background:var(--accent);color:#000;border-radius:20px;padding:12px 14px;margin-bottom:10px;}
  .ev b{display:block;font-size:15px;}
  .ev .w{font-size:12px;margin-top:2px;}
  .ev .memo{font-size:13px;margin-top:6px;white-space:pre-wrap;}
  .ev .row{display:flex;gap:6px;margin-top:10px;}
  .ev button{
    border:2px solid #000;background:transparent;color:#000;border-radius:999px;
    padding:4px 12px;font-size:12px;font-weight:700;
  }
  .ev button:hover{background:#000;color:var(--accent);}
  label.f{display:block;font-size:13px;color:var(--ink);font-weight:700;margin:12px 0 5px;}
  .inp,.txt,.sel{
    width:100%;background:transparent;border:2px solid var(--accent);border-radius:18px;
    color:var(--ink-strong);padding:10px 14px;font-size:15px;outline:none;
  }
  .inp:focus,.txt:focus,.sel:focus{box-shadow:0 0 0 3px var(--glow);}
  .inp::placeholder,.txt::placeholder{color:var(--muted);}
  .txt{resize:vertical;min-height:80px;border-radius:22px;}
  .sel option{background:var(--bg);color:var(--ink-strong);}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
  .hint{font-size:12px;color:var(--muted);margin-top:6px;}
  .err{font-size:12px;color:var(--err);margin-top:6px;min-height:16px;}

  /* ───── Daily ───── */
  .d-head,.d-row{display:grid;grid-template-columns:132px 1fr 112px 44px 34px;gap:8px;align-items:center;}
  .d-head{padding:0 14px 8px;color:var(--ink);font-size:13px;font-weight:700;}
  .d-head div:nth-child(4){text-align:center;}
  .d-row{
    border:2px solid var(--accent);border-radius:999px;padding:8px 12px 8px 14px;margin-bottom:10px;
    transition:background .25s,color .25s;
  }
  .d-row.done{background:var(--accent);}
  .d-row.done .inp,.d-row.done .sel,.d-row.done .sep{color:#000;border-color:rgba(0,0,0,.45);}
  .d-row.done .inp::placeholder{color:rgba(0,0,0,.45);}
  .d-row .inp,.d-row .sel{border-radius:999px;padding:7px 12px;font-size:14px;}
  .time{display:flex;align-items:center;gap:4px;}
  .time .inp{padding:7px 4px;text-align:center;width:56px;}
  .sep{color:var(--ink);font-weight:700;}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  .chk{display:flex;justify-content:center;}
  .chk input{
    appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:50%;
    border:2px solid var(--accent);background:transparent;position:relative;margin:0;
  }
  .chk input:checked{background:#000;border-color:#000;}
  .chk input:checked::after{
    content:"";position:absolute;left:7px;top:3px;width:6px;height:11px;
    border:solid var(--accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg);
  }
  .x{border:none;background:transparent;color:var(--ink);font-size:20px;font-weight:700;width:30px;height:30px;border-radius:50%;}
  .x:hover{background:var(--wash);}
  .d-row.done .x{color:#000;}
  .d-actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
  .empty-note{color:var(--muted);text-align:center;padding:30px 0;font-size:14px;}

  /* ───── Timer ───── */
  .timer-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:4px;}
  .dial{width:min(400px,92%);aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;outline:none;border-radius:50%;}
  .dial svg{width:100%;height:100%;display:block;}
  .dial:focus-visible{box-shadow:0 0 0 3px var(--glow);}
  .dial .wedge{fill:var(--accent);}
  .dial .tick{stroke:var(--ink);opacity:.5;}
  .dial .tick.major{opacity:1;}
  .dial text{fill:var(--ink);font-size:14px;text-anchor:middle;dominant-baseline:central;font-family:var(--font);}
  .readout{font-size:clamp(28px,8vw,40px);font-weight:700;color:var(--ink);letter-spacing:.04em;}
  .readout.finished{animation:blink 1s ease-in-out infinite;}
  @keyframes blink{50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.readout.finished{animation:none}.tab,.cell{transition:none}}
  .tip{font-size:12px;color:var(--muted);}
  .t-ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px;}

  /* ───── Cropper ───── */
  .crop-stage{height:min(50vh,420px);background:var(--bg);border:2px solid var(--accent);border-radius:22px;overflow:hidden;}
  .crop-stage img{display:block;max-width:100%;}
  .cropper-view-box{outline-color:var(--accent);}
  .cropper-line,.cropper-point{background-color:var(--accent);}
  .cropper-point{width:12px;height:12px;opacity:1;border-radius:50%;}
  .point-se{width:12px;height:12px;}
  .shape-round .cropper-view-box,.shape-round .cropper-face{border-radius:12%;}
  .shape-oval .cropper-view-box,.shape-oval .cropper-face{border-radius:50%;}
  .ctl-label{font-size:13px;font-weight:700;color:var(--ink);margin:14px 0 6px;}
  .seg{display:flex;gap:6px;flex-wrap:wrap;}

  /* ───── Lukas pet ───── */
  .hp-a{fill:var(--accent);} .hp-b{fill:var(--accent-deep);} .hp-h{fill:#fff;opacity:.6;}
  .win{
    margin:22px 0 0 22px;padding:3px;background:#C0C0C0;border-radius:0;
    box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #dfdfdf,inset -2px -2px #808080,inset 2px 2px #ffffff;
  }
  .win-bar{height:22px;margin-bottom:3px;padding:0 3px 0 5px;background:var(--accent);display:flex;align-items:center;gap:6px;}
  .win-ico{width:14px;height:12px;flex:0 0 auto;fill:#ffffff;}
  .win-title{flex:1;min-width:0;color:#ffffff;font-size:13px;font-weight:700;text-shadow:1px 1px 0 rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .win-btns{display:flex;gap:2px;}
  .win-btns i{
    width:16px;height:14px;display:flex;align-items:center;justify-content:center;background:#C0C0C0;
    box-shadow:inset -1px -1px #0a0a0a,inset 1px 1px #ffffff,inset -2px -2px #808080,inset 2px 2px #dfdfdf;
  }
  .win-btns svg{width:8px;height:7px;display:block;fill:#000000;}
  .game{
    position:relative;height:136px;padding:0;background:var(--bg);overflow:hidden;border-radius:0;
    box-shadow:inset -1px -1px #ffffff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #0a0a0a;
  }
  .g-title,.g-play{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .g-title[hidden],.g-play[hidden]{display:none;}
  .g-title{background:none;border:none;padding:12px 16px;}
  .g-title .g-logo{display:none;}
  [data-theme="lukas"] .g-logo[data-t="lukas"],[data-theme="leonard"] .g-logo[data-t="leonard"]{display:block;}
  .g-title img{width:min(300px,100%);max-height:100%;object-fit:contain;transition:transform .1s;}
  .g-title:active img{transform:scale(.96);}
  .g-title:focus-visible{outline:2px dashed var(--accent);outline-offset:-8px;}
  .g-back{position:absolute;top:50%;left:14px;transform:translateY(-50%);z-index:2;background:none;border:none;padding:8px;line-height:0;}
  .g-back svg{width:16px;height:19px;display:block;fill:var(--accent);}
  .g-back:active svg{transform:scale(.85);}
  .g-back:focus-visible{outline:2px dashed var(--accent);outline-offset:2px;}
  .pet{--pet-w:108px;display:flex;align-items:center;justify-content:center;gap:4px;}
  .pet-stage{position:relative;width:var(--pet-w);aspect-ratio:360/330;}
  .pet-body{position:absolute;inset:0;transform-origin:50% 100%;}
  .pet-body.pat{animation:pat .35s ease-out;}
  @keyframes pat{0%{transform:scale(1,1)}35%{transform:scale(1.06,.92)}70%{transform:scale(.98,1.04)}100%{transform:scale(1,1)}}
  .pet-sprite{position:absolute;inset:0;background-repeat:no-repeat;background-size:400% 100%;background-position:0 0;}
  .floaters{position:absolute;inset:0;pointer-events:none;}
  .floater{position:absolute;top:18%;width:16px;height:14px;opacity:0;animation:floatUp 1.1s ease-out forwards;}
  .floater svg{width:100%;height:100%;display:block;}
  @keyframes floatUp{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-52px) scale(1.15)}}
  @keyframes fadeOnly{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
  .heart-btn{
    width:56px;height:56px;border:none;background:transparent;padding:0;
    display:flex;align-items:center;justify-content:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    transition:transform .1s;
  }
  .heart-btn svg{width:38px;height:33px;display:block;}
  .heart-btn:active{transform:scale(.85);}
  .heart-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:12px;}
  @media (prefers-reduced-motion:reduce){.g-arrow{animation:none}.pet-body.pat{animation:none}.floater{animation:fadeOnly 1s forwards}}
  @media (max-width:720px){.win{margin-left:17px;}}

  /* ───── Mobile ───── */
  @media (max-width:720px){
    body{padding:10px 10px 40px;}
    .diary{padding-left:17px;}
    .rings{width:34px;top:64px;bottom:30px;}
    .rings i{width:34px;height:13px;}
    .topbar{padding-left:17px;}
    .sheet{border-radius:26px;}
    .tab{font-size:13px;padding:12px 2px;}
    .content{padding:16px 12px 30px 22px;}
    h1{font-size:20px;}
    .dow,.grid{gap:4px;}
    .cell{min-height:70px;border-radius:14px;padding:5px 4px;border-width:1.5px;}
    .chip{font-size:10px;padding:2px 5px;}
    .cell .num{font-size:11px;}
    .cal-title{font-size:18px;min-width:130px;}
    .d-head{display:none;}
    .d-row{
      grid-template-columns:1fr 44px 34px;border-radius:26px;
      grid-template-areas:"time chk x" "task task task" "cat cat cat";
    }
    .d-row .time{grid-area:time}.d-row .chk{grid-area:chk}.d-row .x{grid-area:x}
    .d-row .task{grid-area:task}.d-row .cat{grid-area:cat}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="px-heart" viewBox="0 0 7 6">
    <path class="hp-a" d="M1 0h2v1H1zM4 0h2v1H4zM0 1h7v2H0zM1 3h5v1H1z"/>
    <path class="hp-b" d="M2 4h3v1H2zM3 5h1v1H3z"/>
    <path class="hp-h" d="M1 1h1v1H1z"/>
  </symbol>
</svg>
<div class="wrap">

  <!-- Top bar: theme picker -->
  <div class="topbar">
    <div class="logo">How to...</div>
    <div class="themes" id="themes">
      <button class="theme-btn" data-t="lukas"><i style="background:#FF6B9A"></i>Lukas</button>
      <button class="theme-btn" data-t="leonard"><i style="background:#ABD3DB"></i>Leonard</button>
    </div>
  </div>

  <!-- Diary -->
  <div class="diary">
    <div class="rings"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="sheet">
      <div class="tabs">
        <button class="tab active" data-page="home">Home</button>
        <button class="tab" data-page="cal">Monthly</button>
        <button class="tab" data-page="day">Daily</button>
        <button class="tab" data-page="timer">Timer</button>
      </div>

      <div class="content">

        <!-- Home -->
        <section class="page active" id="page-home">
          <div class="home-box" id="homeBox"></div>
          <div class="home-actions">
            <button class="pill-btn solid" id="upBtn">Upload image</button>
            <button class="pill-btn" id="recropBtn" style="display:none">Edit crop</button>
            <button class="pill-btn" id="rmImgBtn" style="display:none">Remove</button>
          </div>
          <div class="hint" id="homeNote" style="text-align:center"></div>
          <div class="backup">
            <div class="backup-title">Backup</div>
            <p class="hint">Save your calendar, daily list, image and theme to a file, or bring them back from one.</p>
            <div class="home-actions">
              <button class="pill-btn small" id="exportBtn">Save backup file</button>
              <button class="pill-btn small" id="importBtn">Restore from file</button>
            </div>
            <div class="hint" id="backupNote"></div>
            <input type="file" id="importFile" accept="application/json,.json" hidden>
          </div>
          <input type="file" id="file" accept="image/*" hidden>
        </section>

        <!-- Monthly -->
        <section class="page" id="page-cal">
          <div class="cal-head">
            <button class="round" id="prev" aria-label="Previous month">‹</button>
            <div class="cal-title" id="calTitle"></div>
            <button class="round" id="next" aria-label="Next month">›</button>
            <button class="pill-btn small" id="todayBtn">Today</button>

<script>
/* ───── Storage (uses window.storage if available, otherwise memory) ───── */
const mem = {};
const PFX = 'machasal:';     // separate from the first app (same github.io address shares storage); keep unchanged after this
const store = {
  async get(k){
    try{ const v = localStorage.getItem(PFX+k); if(v!==null) return JSON.parse(v); }catch(e){}
    try{ if(window.storage){ const r = await window.storage.get(k); if(r && r.value) return JSON.parse(r.value); } }catch(e){}
    return mem[k] ?? null;
  },
  async set(k,v){            // returns true if it was saved somewhere permanent
    mem[k]=v;
    try{ localStorage.setItem(PFX+k, JSON.stringify(v)); return true; }catch(e){}
    try{ if(window.storage){ await window.storage.set(k, JSON.stringify(v), false); return true; } }catch(e){}
    return false;
  }
};
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* small "tap twice to confirm" helper (confirm() is blocked in some embeds) */
function twoStep(btn, armedLabel, fn){
  let t=null; const orig=btn.textContent;
  btn.addEventListener('click',()=>{
    if(t){ clearTimeout(t); t=null; btn.textContent=orig; fn(); return; }
    btn.textContent=armedLabel;
    t=setTimeout(()=>{ t=null; btn.textContent=orig; },3000);
  });
}

/* ───── Themes ───── */
function setTheme(name, save=true){
  document.documentElement.dataset.theme = name;
  const tc = $('themeColor'); if(tc) tc.setAttribute('content', '#D5D2D1');
  document.querySelectorAll('.theme-btn').forEach(b=>b.classList.toggle('on', b.dataset.t===name));
  if(save) store.set('theme',name);
}
document.querySelectorAll('.theme-btn').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.t)));

/* ───── Tabs ───── */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    $('page-'+t.dataset.page).classList.add('active');
  });
});

/* ───── Home: image upload + crop ───── */
let mainImg = null;        // { orig, out }
let cropper = null, currentOrig = null, cropRatio = NaN, cropShape = 'rect';

function renderHome(){
  const box = $('homeBox');
  if(mainImg && mainImg.out){
    box.classList.add('filled');
    box.innerHTML = `<img src="${mainImg.out}" alt="Home image">`;
  } else {
    box.classList.remove('filled');
    box.innerHTML = '<div class="none">No image yet.<br>Tap “Upload image” to add one.</div>';
  }
  $('recropBtn').style.display = mainImg ? 'inline-block' : 'none';
  $('rmImgBtn').style.display = mainImg ? 'inline-block' : 'none';
}
$('upBtn').onclick = ()=> $('file').click();
$('file').addEventListener('change',e=>{
  const f = e.target.files && e.target.files[0]; e.target.value='';
  if(!f) return;
  const fr = new FileReader();
  fr.onload = ()=>{
    const im = new Image();
    im.onload = ()=>{
      const s = Math.min(1, 1600/Math.max(im.width,im.height));
      const cv = document.createElement('canvas');
      cv.width = Math.round(im.width*s); cv.height = Math.round(im.height*s);
      const cx = cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height);
      cx.drawImage(im,0,0,cv.width,cv.height);
      currentOrig = cv.toDataURL('image/jpeg',.9);
      bgOn = false; showCrop();
    };
    im.src = fr.result;
  };
  fr.readAsDataURL(f);
});
$('recropBtn').onclick = ()=>{ if(mainImg){ currentOrig = mainImg.orig || mainImg.out; bgOn = !!mainImg.bg; showCrop(); } };
twoStep($('rmImgBtn'),'Tap again to remove', async ()=>{ mainImg=null; await store.set('mainImg',null); renderHome(); });

function setSeg(containerId, attr, val){
  document.querySelectorAll(`#${containerId} button`).forEach(b=>b.classList.toggle('on', b.dataset[attr]===val));
}
/* white background removal: clears white connected to the image edges, keeps white inside the subject */
let bgOn = false, bgCache = null;   // bgCache = { src, out }
function removeWhiteBg(src){
  return new Promise((res,rej)=>{
    const im = new Image();
    im.onload = ()=>{
      const w=im.naturalWidth, h=im.naturalHeight, n=w*h;
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const cx=cv.getContext('2d'); cx.drawImage(im,0,0);
      const d=cx.getImageData(0,0,w,h), p=d.data;
      const HARD=232, SOFT=185;
      const lo=i=>Math.min(p[i],p[i+1],p[i+2]), hi=i=>Math.max(p[i],p[i+1],p[i+2]);
      const isBg=k=>{ const i=k*4; return p[i+3]<16 || (lo(i)>=HARD && hi(i)-lo(i)<=24); };
      const gone=new Uint8Array(n), stack=new Int32Array(n); let sp=0;
      const push=k=>{ if(!gone[k] && isBg(k)){ gone[k]=1; stack[sp++]=k; } };
      for(let x=0;x<w;x++){ push(x); push((h-1)*w+x); }
      for(let y=0;y<h;y++){ push(y*w); push(y*w+w-1); }
      while(sp){
        const k=stack[--sp], x=k%w;
        if(x>0) push(k-1); if(x<w-1) push(k+1); if(k>=w) push(k-w); if(k<n-w) push(k+w);
      }
      for(let k=0;k<n;k++) if(gone[k]) p[k*4+3]=0;
      // soften a 2px rim so no white halo is left around the subject
      let ring=gone; const done=gone.slice();
      for(let pass=0;pass<2;pass++){
        const next=new Uint8Array(n);
        for(let k=0;k<n;k++){
          if(done[k]) continue;
          const x=k%w;
          if(!((x>0&&ring[k-1])||(x<w-1&&ring[k+1])||(k>=w&&ring[k-w])||(k<n-w&&ring[k+w]))) continue;
          next[k]=1;
          const i=k*4, m=lo(i);
          if(m<=SOFT) continue;
          const a=Math.max(.04, 1-Math.min(1,(m-SOFT)/(HARD-SOFT)));
          for(let c=0;c<3;c++) p[i+c]=Math.max(0,Math.min(255,Math.round((p[i+c]-255*(1-a))/a)));
          p[i+3]=Math.round(p[i+3]*a);
        }
        for(let k=0;k<n;k++) if(next[k]) done[k]=1;
        ring=next;
      }
      cx.putImageData(d,0,0); res(cv.toDataURL('image/png'));
    };
    im.onerror=()=>rej(new Error('Image failed to load'));
    im.src=src;
  });
}

function maskCanvas(src, shape){
  const w=src.width, h=src.height;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); x.beginPath();
  if(shape==='oval'){ x.ellipse(w/2,h/2,w/2,h/2,0,0,Math.PI*2); }
  else{
    const r=Math.min(w,h)*0.12;
    x.moveTo(r,0); x.arcTo(w,0,w,h,r); x.arcTo(w,h,0,h,r); x.arcTo(0,h,0,0,r); x.arcTo(0,0,w,0,r); x.closePath();
  }
  x.clip(); x.drawImage(src,0,0); return c;
}

/* ───── Monthly calendar ───── */
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
let events = {};
let view = new Date(); view.setDate(1);
let selKey = null, editIdx = null;
const keyOf = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;

function renderCal(){
  const y = view.getFullYear(), m = view.getMonth();
  $('calTitle').textContent = `${MONTHS[m]} ${y}`;
  const first = new Date(y,m,1).getDay();
  const days = new Date(y,m+1,0).getDate();
  const prevDays = new Date(y,m,0).getDate();
  const total = Math.ceil((first+days)/7)*7;
  const now = new Date();
  const todayKey = keyOf(now.getFullYear(),now.getMonth(),now.getDate());
  let html = '';
  for(let i=0;i<total;i++){
    let d, mm=m, out=false;
    if(i<first){ d=prevDays-first+i+1; mm=m-1; out=true; }
    else if(i>=first+days){ d=i-first-days+1; mm=m+1; out=true; }
    else d=i-first+1;
    const dt = new Date(y,mm,d);
    const k = keyOf(dt.getFullYear(),dt.getMonth(),dt.getDate());
    const list = events[k] || [];
    const cls = ['cell']; if(out) cls.push('out'); if(list.length) cls.push('has'); if(k===todayKey) cls.push('today');
    html += `<button class="${cls.join(' ')}" data-k="${k}"><span class="num">${d}</span>` +
      list.map(e=>`<span class="chip">${esc(e.title)}</span>`).join('') + `</button>`;
  }
  $('grid').innerHTML = html;
}
$('grid').addEventListener('click',e=>{ const c=e.target.closest('.cell'); if(c) openModal(c.dataset.k); });
$('prev').onclick = ()=>{ view.setMonth(view.getMonth()-1); renderCal(); };
$('next').onclick = ()=>{ view.setMonth(view.getMonth()+1); renderCal(); };
$('todayBtn').onclick = ()=>{ view = new Date(); view.setDate(1); renderCal(); };

function openModal(k){
  selKey = k; editIdx = null;
  const [y,m,d] = k.split('-').map(Number);
  $('mTitle').textContent = `${MONTHS[m-1]} ${d}, ${y}`;
  drawModal();
  $('overlay').classList.add('open');
}
function drawModal(){
  const list = events[selKey] || [];
  $('evList').innerHTML = list.map((e,i)=>`
    <div class="ev">
      <b>${esc(e.title)}</b>
      ${e.who?`<div class="w">W/ ${esc(e.who)}</div>`:''}
      ${e.memo?`<div class="memo">${esc(e.memo)}</div>`:''}
      <div class="row"><button data-edit="${i}">Edit</button><button data-del="${i}">Delete</button></div>
    </div>`).join('');
  const canAdd = editIdx!==null || list.length<3;
  $('formBox').style.display = canAdd ? 'block':'none';
  $('saveBtn').style.display = canAdd ? 'inline-block':'none';
  $('fullHint').style.display = canAdd ? 'none':'block';
  const cur = editIdx!==null ? list[editIdx] : {title:'',who:'',memo:''};
  $('fTitle').value = cur.title; $('fWho').value = cur.who||''; $('fMemo').value = cur.memo||'';
  $('fErr').textContent = '';
  $('saveBtn').textContent = editIdx!==null ? 'Save changes' : 'Save';
}
$('evList').addEventListener('click',async e=>{
  const ed = e.target.dataset.edit, de = e.target.dataset.del;
  if(ed!==undefined){ editIdx = Number(ed); drawModal(); $('fTitle').focus(); }
  if(de!==undefined){
    events[selKey].splice(Number(de),1);
    if(!events[selKey].length) delete events[selKey];
    editIdx = null; await store.set('events',events); drawModal(); renderCal();
  }
});
$('saveBtn').onclick = async ()=>{
  const title = $('fTitle').value.trim();
  if(!title){ $('fErr').textContent = 'Please enter a title.'; $('fTitle').focus(); return; }
  const item = {title, who:$('fWho').value.trim(), memo:$('fMemo').value.trim()};
  events[selKey] = events[selKey] || [];
  if(editIdx!==null) events[selKey][editIdx] = item;

function clampField(f,v){

/* ───── Timer (classic dial) ───── */
const CX=140, CY=140, WR=88;
let remain=25*60, lastSet=25, running=false, endAt=0, tick=null, ac=null, dragging=false, lastM=null;
function fmt(s){ s=Math.max(0,Math.ceil(s)); return `${pad(Math.floor(s/60))}:${pad(s%60)}`; }
function buildDial(){
  let h='';
  for(let i=0;i<60;i++){
    const a=i/60*2*Math.PI, major=i%5===0, r1=96, r2=major?110:103;
    h+=`<line class="tick ${major?'major':''}" stroke-width="${major?3.2:1.4}" x1="${CX+r1*Math.sin(a)}" y1="${CY-r1*Math.cos(a)}" x2="${CX+r2*Math.sin(a)}" y2="${CY-r2*Math.cos(a)}"/>`;
  }
  for(let i=0;i<60;i+=5){
    const a=i/60*2*Math.PI, r=126;
    h+=`<text x="${CX+r*Math.sin(a)}" y="${CY-r*Math.cos(a)}">${i}</text>`;
  }
  $('ticks').innerHTML=h;
}
function wedgePath(m){
  if(m<=0) return '';
  if(m>=60) return `M ${CX} ${CY-WR} A ${WR} ${WR} 0 1 1 ${CX} ${CY+WR} A ${WR} ${WR} 0 1 1 ${CX} ${CY-WR} Z`;
  const a=m/60*2*Math.PI, x=CX+WR*Math.sin(a), y=CY-WR*Math.cos(a);
  return `M ${CX} ${CY} L ${CX} ${CY-WR} A ${WR} ${WR} 0 ${m>30?1:0} 1 ${x} ${y} Z`;
}
function drawTimer(){
  const m=Math.min(60,remain/60);
  $('wedge').setAttribute('d',wedgePath(m));
  $('read').textContent=fmt(remain);
  $('dial').setAttribute('aria-valuenow',Math.round(m));
  const paused=!running && remain>0 && Math.round(remain)!==lastSet*60;
  $('startBtn').textContent=running?'Pause':(paused?'Resume':'Start');
}
function setMinutes(m){
  m=Math.max(0,Math.min(60,m));
  lastSet=m; remain=m*60;
  $('read').classList.remove('finished');
  if(running){ if(m===0) stopTick(); else endAt=Date.now()+remain*1000; }
  drawTimer();
}
function angleMin(e){
  const r=$('dialSvg').getBoundingClientRect();
  const dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
  let a=Math.atan2(dx,-dy); if(a<0) a+=2*Math.PI;
  let m=Math.round(a/(2*Math.PI)*60); if(m===60) m=0;
  if(lastM!==null){
    if(lastM>=45 && m<=15) m=60;        // dragged clockwise past 0 → full dial
    else if(lastM<=15 && m>=45) m=0;    // dragged back past 0 → zero
  }
  return m;
}
function beep(){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    [0,.3,.6].forEach(t=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.frequency.value=880; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(.0001,ac.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.25,ac.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t+.22);
      o.start(ac.currentTime+t); o.stop(ac.currentTime+t+.25);
    });
  }catch(e){}
}
function stopTick(){ clearInterval(tick); tick=null; running=false; }
const dial=$('dial');
dial.addEventListener('pointerdown',e=>{
  dragging=true; lastM=null;
  try{ dial.setPointerCapture(e.pointerId); }catch(_){}
  const m=angleMin(e); lastM=m; setMinutes(m); e.preventDefault();
});
dial.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const m=angleMin(e); lastM=m; setMinutes(m);
});
['pointerup','pointercancel'].forEach(t=>dial.addEventListener(t,()=>{ dragging=false; lastM=null; }));
dial.addEventListener('keydown',e=>{
  const cur=Math.round(remain/60); let m=null;
  if(e.key==='ArrowRight'||e.key==='ArrowUp') m=cur+1;
  if(e.key==='ArrowLeft'||e.key==='ArrowDown') m=cur-1;
  if(m!==null){ e.preventDefault(); setMinutes(m); }
});
$('startBtn').onclick=()=>{
  if(running){ stopTick(); drawTimer(); return; }
  if(remain<=0) remain=lastSet*60;
  if(remain<=0) return;
  $('read').classList.remove('finished');
  running=true; endAt=Date.now()+remain*1000;
  tick=setInterval(()=>{
    remain=(endAt-Date.now())/1000;
    if(remain<=0){ remain=0; stopTick(); $('read').classList.add('finished'); beep(); }
    drawTimer();
  },200);
  drawTimer();
};
$('resetBtn').onclick=()=>{ stopTick(); $('read').classList.remove('finished'); remain=lastSet*60; drawTimer(); };
buildDial();

const PET_ALT = {normal:'Lukas, relaxed', hungry:'Lukas, hungry and waiting for a snack', happy:'Lukas, happy'};
const PET_HUNGRY_AFTER = 5*60*1000;   // no attention for 5 min → hungry
const PET_HAPPY_FOR = 60*1000;        // happy lasts 1 min → back to normal
const PET_TAPS = 10;                  // 10 heart taps → happy
let petStarted = false, petState = 'normal', petTaps = 0, lastCare = Date.now(), happyAt = 0, petFrame = 0, petNext = 0;
const PET_SPEED = {normal:800, hungry:600, happy:450};   // ms per frame
function petAnimate(t){
  if(t >= petNext){
    petFrame = (petFrame+1) % 4;
    $('petSprite').style.backgroundPosition = (petFrame*100/3)+'% 0';
    petNext = t + PET_SPEED[petState];
  }
  requestAnimationFrame(petAnimate);
}
function petBounce(){ const b=$('petBody'); b.classList.remove('pat'); void b.offsetWidth; b.classList.add('pat'); }
function setPet(state, first){
  petState = state; petTaps = 0;
  const sp = $('petSprite'); sp.dataset.s = state; sp.style.backgroundImage = 'url('+PET_IMG[state]+')';
  sp.setAttribute('aria-label', PET_ALT[state]);
  petFrame = 0; sp.style.backgroundPosition = '0% 0';   // restart from frame 1
  if(!first) petBounce();
}
function petCheck(){
  if(!petStarted) return;
  const now = Date.now();
  if(petState==='normal' && now-lastCare >= PET_HUNGRY_AFTER) setPet('hungry');
  else if(petState==='happy' && now-happyAt >= PET_HAPPY_FOR){ lastCare = now; setPet('normal'); }
}
function spawnHeart(){
  const f = document.createElement('div'); f.className = 'floater';
  f.style.setProperty('--dx', (Math.random()*56-28)+'px');
  f.style.left = (36+Math.random()*28)+'%';
  f.innerHTML = '<svg viewBox="0 0 7 6" shape-rendering="crispEdges"><use href="#px-heart"/></svg>';
  $('floaters').appendChild(f); setTimeout(()=>f.remove(),1200);
}
$('heartBtn').addEventListener('click',()=>{
  const now = Date.now(); lastCare = now; petBounce(); spawnHeart();
  if(petState==='happy'){ spawnHeart(); return; }
  petTaps++;
  if(petTaps >= PET_TAPS){ happyAt = now; setPet('happy'); }
});
setPet('normal', true);
$('gStart').addEventListener('click',()=>{
  $('gStart').hidden = true; $('gPlay').hidden = false;
  if(!petStarted){ petStarted = true; lastCare = Date.now(); setPet('normal', true); }
  $('heartBtn').focus({preventScroll:true});
});
$('gBack').addEventListener('click',()=>{ $('gPlay').hidden = true; $('gStart').hidden = false; $('gStart').focus({preventScroll:true}); });
requestAnimationFrame(t=>{ petNext = t + PET_SPEED.normal; requestAnimationFrame(petAnimate); });
Object.values(PET_IMG).forEach(src=>{ const i=new Image(); i.src=src; });
setInterval(petCheck,1000);
document.addEventListener('visibilitychange',petCheck);

/* ───── Backup: export / import ───── */
$('exportBtn').onclick = ()=>{
  const data = {app:'machasal', version:1, savedAt:new Date().toISOString(),
    events, rows, mainImg, theme:document.documentElement.dataset.theme};
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const url = URL.createObjectURL(blob), a = document.createElement('a'), d = new Date();
  a.href = url; a.download = `machasal-backup-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  $('backupNote').textContent = 'Backup file saved to your downloads.';
};
$('importBtn').onclick = ()=> $('importFile').click();
$('importFile').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if(!f) return;
  const fr = new FileReader();
  fr.onload = async ()=>{
    try{
      const d = JSON.parse(fr.result);
      if(!d || d.app!=='machasal') throw new Error('not a backup');
      events = (d.events && typeof d.events==='object') ? d.events : {};
      rows = Array.isArray(d.rows) ? d.rows : [];
      mainImg = (d.mainImg && d.mainImg.out) ? d.mainImg : null;
      await store.set('events',events); await store.set('rows',rows); await store.set('mainImg',mainImg);
      if(['lukas','leonard'].includes(d.theme)) setTheme(d.theme);
      renderHome(); renderCal(); renderRows();
      $('backupNote').textContent = 'Restored from backup.';
    }catch(err){
      $('backupNote').textContent = 'This file is not a Machasal backup. Choose a file made with “Save backup file”.';
    }
  };
  fr.readAsText(f);
});

/* ───── Offline / install support ───── */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});   // scope = this repo folder only });
}

/* ───── Init ───── */
(async function init(){
  const th = await store.get('theme');
  setTheme(['lukas','leonard'].includes(th) ? th : 'lukas', false);
  events = (await store.get('events')) || {};
  rows = (await store.get('rows')) || [];
  mainImg = await store.get('mainImg');
  renderHome(); renderCal(); renderRows(); drawTimer();
})();
</script>
